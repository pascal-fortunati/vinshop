server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;
    charset utf-8;
    autoindex off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(config|core|helpers|models|controllers|routes|storage|views)/ {
        deny all;
    }

    location ~* \.(sql|md|json|lock)$ {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        expires 1y;
        access_log off;
    }

    location ~* \.(css|js)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
}
