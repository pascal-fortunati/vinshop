services:
  app:
    build: .
    container_name: vinshop-app
    depends_on:
      - db
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_NAME: vinshop
      DB_USER: vinshop
      DB_PASSWORD: vinshop
      DB_CHARSET: utf8mb4
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    container_name: vinshop-nginx
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mariadb:11.4
    container_name: vinshop-db
    environment:
      MARIADB_DATABASE: vinshop
      MARIADB_USER: vinshop
      MARIADB_PASSWORD: vinshop
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./vinshop.sql:/docker-entrypoint-initdb.d/001_vinshop.sql:ro

volumes:
  db_data:
